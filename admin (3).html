<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bizz Manager — Super Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0f1117;--bg2:#161b27;--bg3:#1e2535;--border:#2a3347;--border2:#334060;--text:#e8eaf2;--text2:#8b93a8;--text3:#5c6479;--accent:#4f7bff;--accent-glow:rgba(79,123,255,.18);--green:#22c55e;--green-dim:rgba(34,197,94,.15);--orange:#f59e0b;--orange-dim:rgba(245,158,11,.15);--red:#ef4444;--red-dim:rgba(239,68,68,.15)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 Inter,sans-serif;min-height:100vh}
h1,h2{font-family:'Space Grotesk',sans-serif}
.hidden{display:none!important}
input{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:11px 12px;color:var(--text);font-size:14px;width:100%;outline:none}
input:focus{border-color:var(--accent)}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:600;width:100%}
.btn-sm{background:var(--bg2);color:var(--text2);border:1px solid var(--border2);border-radius:8px;padding:6px 12px;font-size:13px;white-space:nowrap}
.btn-sm:hover{background:var(--bg3);color:var(--text)}
.btn-sm.on{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}
.btn-sm.go{color:var(--green);border-color:var(--green)}
.btn-sm.stop{color:var(--red);border-color:var(--red)}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:12px}
#login{max-width:380px;margin:12vh auto 0;padding:28px 22px}
#login h1{font-size:22px;margin-bottom:4px}
#login p{color:var(--text2);margin-bottom:18px}
#login input{margin-bottom:12px}
.err{color:#fca5a5;font-size:13px;margin-bottom:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
header h1{font-size:18px}
main{max-width:1000px;margin:0 auto;padding:20px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.toolbar input{width:210px;padding:7px 12px}
.toolbar button:last-of-type{margin-right:auto}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--bg2);padding:10px 16px;text-align:left;font-size:12px;font-weight:600;color:var(--text3);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
tr:last-child td{border-bottom:0}
.badge{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pending{background:var(--orange-dim);color:var(--orange)}
.active{background:var(--green-dim);color:var(--green)}
.suspended{background:var(--red-dim);color:#fca5a5}
.empty{text-align:center;color:var(--text3);padding:28px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border2);padding:10px 18px;border-radius:8px}
</style>
</head>
<body>

<div id="login" class="card">
  <h1>Super Admin</h1>
  <p>Bizz Manager account approvals</p>
  <input id="email" type="email" placeholder="Admin email" />
  <input id="password" type="password" placeholder="Password" />
  <div id="login-err" class="err hidden"></div>
  <button class="btn" onclick="signIn()">Sign in</button>
</div>

<div id="panel" class="hidden">
  <header>
    <h1>Accounts</h1>
    <button class="btn-sm" onclick="auth.signOut()">Sign out</button>
  </header>
  <main>
    <div class="card">
      <div class="toolbar">
        <span id="tabs" style="display:contents"></span>
        <button class="btn-sm" onclick="importExisting()">Refresh old accounts</button>
        <input id="q" type="search" placeholder="Search business or email" oninput="draw()" />
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Business</th><th>Owner</th><th>Email</th><th>Signed up</th><th>Status</th><th></th></tr></thead>
          <tbody id="rows"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<div id="toast" class="hidden"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyBCr8kHQRIuEeccbhVvsCEbud2xrM_c0mk",
  authDomain: "bizz-manager.firebaseapp.com",
  projectId: "bizz-manager",
  storageBucket: "bizz-manager.firebasestorage.app",
  messagingSenderId: "655353423303",
  appId: "1:655353423303:web:e65a724f5108d6fa36a5e2"
});
const auth = firebase.auth(), db = firebase.firestore();
let accounts = [], filter = "pending", unsub = null, synced = false;

const $ = id => document.getElementById(id);
const esc = s => String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.remove("hidden"); setTimeout(()=>t.classList.add("hidden"),3000); }
function showErr(m){ const e=$("login-err"); e.textContent=m; e.classList.remove("hidden"); }

async function signIn(){
  $("login-err").classList.add("hidden");
  try { await auth.signInWithEmailAndPassword($("email").value.trim(), $("password").value); }
  catch(e){ showErr("Incorrect email or password."); }
}

auth.onAuthStateChanged(async user => {
  if (unsub) { unsub(); unsub = null; }
  if (!user) { $("panel").classList.add("hidden"); $("login").classList.remove("hidden"); return; }
  // Only accounts listed in admins/{uid} may enter
  let ok = false, why = "";
  try {
    ok = (await db.collection("admins").doc(user.uid).get()).exists;
    if (!ok) why = "Not a super admin: no document in the 'admins' collection with ID " + user.uid;
  } catch(e){
    why = "Could not read 'admins' (" + (e.code || e.message) + "). Check the STEP A rules are published.";
  }
  if (!ok) { showErr(why); await auth.signOut(); return; }
  $("login").classList.add("hidden"); $("panel").classList.remove("hidden");
  unsub = db.collection("accounts").onSnapshot(snap => {
    accounts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    draw();
    if (!synced) { synced = true; importExisting(true); } // pull in old accounts automatically on every visit
  }, e => toast("Could not load accounts: " + e.message));
});

function draw(){
  const st = a => a.status || "pending";
  const n = k => k === "all" ? accounts.length : accounts.filter(a => st(a) === k).length;
  $("tabs").innerHTML = [["pending","Pending"],["active","Active"],["suspended","Suspended"],["all","All"]]
    .map(([k,l]) => `<button class="btn-sm ${filter===k?"on":""}" onclick="filter='${k}';draw()">${l} (${n(k)})</button>`).join("");

  const q = $("q").value.trim().toLowerCase();
  const ms = a => a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
  const rows = accounts
    .filter(a => (filter === "all" || st(a) === filter) &&
      (!q || (a.bizName + " " + a.email + " " + a.firstName + " " + a.lastName).toLowerCase().includes(q)))
    .sort((a,b) => ms(b) - ms(a));

  const action = a => st(a) === "pending" ? `<button class="btn-sm go" onclick="setStatus('${esc(a.id)}','active')">Approve</button>`
    : st(a) === "active" ? `<button class="btn-sm stop" onclick="setStatus('${esc(a.id)}','suspended')">Suspend</button>`
    : `<button class="btn-sm go" onclick="setStatus('${esc(a.id)}','active')">Reactivate</button>`;

  $("rows").innerHTML = rows.length ? rows.map(a => `<tr>
    <td>${esc(a.bizName) || "—"}</td>
    <td>${esc(((a.firstName||"") + " " + (a.lastName||"")).trim()) || "—"}</td>
    <td>${esc(a.email)}</td>
    <td>${ms(a) ? new Date(ms(a)).toLocaleDateString() : "—"}</td>
    <td><span class="badge ${st(a)}">${st(a)}</span></td>
    <td>${action(a)}</td></tr>`).join("")
    : `<tr><td colspan="6" class="empty">No accounts here.</td></tr>`;
}

// Adds every existing business that has no account record yet as Pending, even if the owner never logged in.
// Runs automatically when you open this page; the button runs it again.
async function importExisting(auto){
  try {
    const have = new Set(accounts.map(a => a.id));
    have.add(auth.currentUser.uid);
    const snap = await db.collection("businesses").get();
    const todo = snap.docs.filter(d => !have.has(d.id));
    for (let i = 0; i < todo.length; i += 400) {
      const batch = db.batch();
      todo.slice(i, i + 400).forEach(d => {
        const b = d.data();
        batch.set(db.collection("accounts").doc(d.id), {
          firstName: b.firstName || "", lastName: b.lastName || "", bizName: b.bizName || "",
          bizType: b.bizType || "", email: b.email || "", status: "pending",
          createdAt: b.createdAt || firebase.firestore.FieldValue.serverTimestamp()
        });
      });
      await batch.commit();
    }
    if (todo.length) toast(todo.length + " old account(s) added as Pending");
    else if (!auto) toast("No old accounts missing");
  } catch(e){ toast("Could not load old accounts. Publish the updated rules first. (" + (e.code || e.message) + ")"); }
}

async function setStatus(id, status){
  const a = accounts.find(x => x.id === id) || {};
  const name = a.bizName || a.email || "this account";
  const msg = status === "suspended" ? `Suspend ${name}? They are locked out until you reactivate.`
    : a.status === "suspended" ? `Reactivate ${name}?`
    : `Approve ${name}? Confirm their payment has been received.`;
  if (!confirm(msg)) return;
  try {
    await db.collection("accounts").doc(id).update({ status, statusChangedAt: firebase.firestore.FieldValue.serverTimestamp() });
    toast(status === "suspended" ? "Account suspended" : "Account activated");
  } catch(e){ toast("Could not update: " + e.message); }
}
</script>
</body>
</html>
